<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    양돈장 실시간 대시보드
  </title>


  <style>

    :root {
      --main:#01696f;
      --main-dark:#0c4e54;
      --success:#22a06b;
      --danger:#e74c3c;
      --danger-dark:#a12c2c;
      --bg:#f4f6f9;
      --card:#ffffff;
      --line:#e5e7eb;
      --text:#222222;
      --muted:#666666;
      --blue:#4f6fe8;
    }


    * {
      box-sizing:border-box;
    }


    body {
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

      background:var(--bg);
      color:var(--text);

      margin:0;
      padding:12px;
    }


    .status-bar {
      min-height:32px;
      padding:7px 14px;
      border-radius:8px;
      font-size:.86rem;
      font-weight:700;
      color:#fff;
      background:var(--main);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }


    .status-bar.success {
      background:#3a7d1f;
    }


    .status-bar.error {
      background:var(--danger-dark);
    }


    .status-left {
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }


    .status-right {
      font-size:.78rem;
      opacity:.9;
      white-space:nowrap;
    }


    .dashboard-title {
      background:#fff;
      border-radius:12px;
      padding:14px 16px;
      margin-bottom:12px;
      box-shadow:0 2px 6px rgba(0,0,0,.05);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }


    .title-wrap {
      min-width:260px;
      flex:1;
    }


    .title-row {
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }


    .dashboard-title h1 {
      margin:0;
      color:var(--main);
      font-size:1.35rem;
    }


    .log-date-badge {
      display:inline-flex;
      align-items:center;
      padding:5px 10px;
      border-radius:999px;
      background:#eef7f0;
      color:#3a7d1f;
      border:1px solid #cfe6d2;
      font-size:.86rem;
      font-weight:800;
      white-space:nowrap;
    }


    .subtitle {
      color:var(--muted);
      font-size:.86rem;
      margin-top:4px;
    }


    .top-actions {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }


    .language-select {
      height:40px;
      padding:0 10px;
      border:1px solid #cbd5e1;
      border-radius:8px;
      background:#fff;
      font-size:.92rem;
      font-weight:700;
      color:var(--main);
      cursor:pointer;
    }


    .btn {
      background:var(--main);
      color:#fff;
      padding:10px 14px;
      border:none;
      border-radius:8px;
      font-size:.92rem;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }


    .btn:hover {
      background:var(--main-dark);
    }


    .btn:disabled {
      background:#999;
      cursor:wait;
    }


    .btn.secondary {
      background:#34495e;
    }


    .metrics-grid {
      display:grid;
      grid-template-columns:
        repeat(
          4,
          minmax(150px,1fr)
        );
      gap:10px;
      margin-bottom:10px;
    }


    .metrics-grid.bottom-row {
      margin-bottom:14px;
    }


    .card {
      background:var(--card);
      padding:14px 16px;
      border-radius:12px;
      border-left:5px solid var(--main);
      box-shadow:0 2px 6px rgba(0,0,0,.05);
      min-height:96px;
    }


    .card.danger {
      border-left-color:#c0392b;
    }


    .card.success {
      border-left-color:#3a7d1f;
    }


    .card h3 {
      margin:0 0 8px;
      font-size:.88rem;
      color:var(--muted);
    }


    .card .value {
      font-size:1.75rem;
      font-weight:800;
      color:#111;
      line-height:1.1;
    }


    .card .sub-value {
      margin-top:5px;
      font-size:.78rem;
      color:#777;
    }


    /*
     * 하단 정확히 50:50
     */
    .overview-grid {
      display:grid;
      grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);
      gap:16px;
      margin-bottom:12px;
      align-items:stretch;
    }


    .panel {
      min-width:0;
      background:var(--card);
      padding:16px;
      border-radius:20px;
      box-shadow:0 6px 18px rgba(0,0,0,.06);
    }


    .panel-header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      border-bottom:2px solid #eef1f6;
      padding-bottom:10px;
      margin-bottom:12px;
    }


    .panel h2 {
      margin:0;
      color:#4b5563;
      font-size:1.1rem;
      font-weight:900;
    }


    .movement-table-wrap {
      overflow-x:auto;
    }


    .movement-table {
      width:100%;
      border-collapse:collapse;
      text-align:center;
      font-size:.92rem;
    }


    .movement-table th {
      background:#f5f7fb;
      color:var(--blue);
      padding:14px 7px;
      font-weight:900;
      border-bottom:2px solid #d9dee8;
      white-space:nowrap;
    }


    .movement-table td {
      padding:16px 7px;
      border-bottom:1px solid #edf0f5;
    }


    .movement-table .row-name {
      text-align:left;
      font-weight:900;
      color:#1f2937;
      min-width:120px;
    }


    .movement-table .current-strong {
      font-weight:900;
      color:#1f2937;
    }


    .positive-text {
      color:#119c2b;
      font-weight:900;
    }


    .negative-text {
      color:#f39c12;
      font-weight:900;
    }


    .pill {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:32px;
      height:32px;
      padding:0 9px;
      border-radius:999px;
      color:#fff;
      font-weight:900;
    }


    .pill.red {
      background:#e74c3c;
    }


    .pill.green {
      background:#28c17b;
    }


    .monthly-status-body {
      min-height:360px;
    }


    .monthly-table-wrap {
      overflow-x:auto;
    }


    .monthly-table {
      width:100%;
      min-width:500px;
      border-collapse:collapse;
      table-layout:fixed;
      font-size:.85rem;
    }


    .monthly-table th {
      padding:10px 5px;
      background:#f5f7fb;
      color:var(--blue);
      border-bottom:2px solid #d9dee8;
      text-align:center;
      font-weight:900;
    }


    .monthly-table td {
      padding:14px 5px;
      border-bottom:1px solid #edf0f5;
      text-align:center;
      font-weight:800;
    }


    .monthly-table .metric-name {
      text-align:left;
      color:#1f2937;
    }


    .monthly-ytd {
      color:var(--main);
    }


    .delta-good {
      color:#168447;
    }


    .delta-bad {
      color:#d63e2f;
    }


    .delta-neutral {
      color:#777;
    }


    .chart-section {
      margin-top:14px;
      padding-top:12px;
      border-top:1px solid #edf0f5;
    }


    .chart-title {
      margin-bottom:8px;
      color:#4b5563;
      font-size:.9rem;
      font-weight:900;
    }


    .chart-wrap {
      overflow-x:auto;
    }


    #monthly-chart {
      min-width:480px;
    }


    .monthly-chart-svg {
      width:100%;
      height:225px;
      display:block;
    }


    .chart-legend {
      display:flex;
      justify-content:center;
      gap:20px;
      margin-top:5px;
      font-size:.78rem;
      font-weight:800;
    }


    .legend-sale {
      display:inline-block;
      width:13px;
      height:9px;
      background:#4f6fe8;
      margin-right:5px;
    }


    .legend-loss {
      display:inline-block;
      width:18px;
      height:3px;
      background:#e74c3c;
      margin-right:5px;
      vertical-align:middle;
    }


    .data-note {
      margin-top:6px;
      text-align:right;
      color:#777;
      font-size:.72rem;
    }


    .small-note {
      font-size:.78rem;
      color:var(--muted);
      margin-top:8px;
      text-align:center;
    }


    .debug-box {
      margin-top:10px;
      padding:10px;
      background:#f8f9fa;
      border-radius:8px;
      font-size:.78rem;
      color:#666;
      line-height:1.5;
      display:block;
      word-break:break-all;
    }


    .empty-message {
      color:#999;
      padding:28px;
      text-align:center;
    }


    .overlay {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.35);
      display:none;
      z-index:998;
    }


    .overlay.open {
      display:block;
    }


    .side-panel {
      position:fixed;
      top:0;
      left:-760px;
      width:720px;
      max-width:94vw;
      height:100vh;
      background:#fff;
      box-shadow:4px 0 18px rgba(0,0,0,.22);
      z-index:999;
      transition:left .25s ease;
      display:flex;
      flex-direction:column;
    }


    .side-panel.open {
      left:0;
    }


    .side-header {
      padding:14px;
      background:var(--main);
      color:#fff;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
    }


    .side-header h2 {
      margin:0;
      font-size:1rem;
    }


    .close-btn {
      border:none;
      background:rgba(255,255,255,.18);
      color:#fff;
      border-radius:6px;
      padding:6px 10px;
      cursor:pointer;
      font-weight:800;
    }


    .side-body {
      padding:12px;
      overflow-y:auto;
      flex:1;
      background:#f8fafc;
    }


    .tree-group {
      background:#fff;
      border:1px solid var(--line);
      border-radius:10px;
      margin-bottom:8px;
      overflow:hidden;
    }


    .tree-title {
      padding:11px 12px;
      cursor:pointer;
      font-weight:800;
      color:var(--main);
      background:#fff;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:6px;
    }


    .tree-content {
      display:none;
      padding:0 10px 10px;
      border-top:1px solid var(--line);
    }


    .tree-group.open .tree-content {
      display:block;
    }


    .detail-table {
      width:100%;
      min-width:650px;
      border-collapse:collapse;
      text-align:center;
      font-size:.78rem;
    }


    .detail-table th,
    .detail-table td {
      padding:6px 5px;
      border-bottom:1px solid #eee;
    }


    .detail-table th {
      background:#f8f9fa;
      color:var(--main);
      font-weight:800;
    }


    .text-left {
      text-align:left;
      font-weight:700;
    }


    .number-strong {
      font-weight:800;
      color:#111;
    }


    .danger-text {
      color:#d63e2f;
      font-weight:800;
    }


    .success-text {
      color:#22a06b;
      font-weight:800;
    }


    @media(max-width:1200px) {

      .overview-grid {
        grid-template-columns:1fr;
      }
    }


    @media(max-width:900px) {

      .metrics-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(140px,1fr)
          );
      }
    }


    @media(max-width:560px) {

      body {
        padding:8px;
      }


      .metrics-grid {
        grid-template-columns:1fr;
      }


      .status-bar {
        height:auto;
        line-height:1.3;
        padding:9px 12px;
        align-items:flex-start;
        flex-direction:column;
      }


      .top-actions {
        width:100%;
      }


      .language-select,
      .btn {
        width:100%;
      }
    }

  </style>

</head>


<body>


  <div
    class="status-bar"
    id="status-bar"
  >

    <div
      class="status-left"
      id="status-text"
    ></div>

    <div
      class="status-right"
      id="status-time"
    ></div>

  </div>


  <div class="dashboard-title">

    <div class="title-wrap">

      <div class="title-row">

        <h1
          data-i18n="dashboardTitle"
        ></h1>

        <span
          class="log-date-badge"
          id="latest-log-date"
        ></span>

      </div>


      <div
        class="subtitle"
        data-i18n="subtitle"
      ></div>

    </div>


    <div class="top-actions">

      <select
        class="language-select"
        id="language-select"
        onchange="changeLanguage(this.value)"
      >

        <option value="ko">
          한국어
        </option>

        <option value="ru">
          Русский
        </option>

      </select>


      <button
        class="btn secondary"
        onclick="openSidePanel()"
        data-i18n="detailButton"
      ></button>


      <button
        class="btn"
        id="btn-sync"
        onclick="loadPigsData()"
        data-i18n="updateButton"
      ></button>

    </div>

  </div>


  <div class="metrics-grid">

    <div class="card">

      <h3
        data-i18n="estimatedMsy"
      ></h3>

      <div
        class="value"
        id="val-msy"
      >
        -
      </div>

      <div
        class="sub-value"
        data-i18n="estimatedMsyNote"
      ></div>

    </div>


    <div class="card">

      <h3
        data-i18n="totalPigs"
      ></h3>

      <div
        class="value"
        id="val-total"
      >
        0
      </div>

      <div
        class="sub-value"
        data-i18n="totalPigsNote"
      ></div>

    </div>


    <div class="card">

      <h3
        data-i18n="sowCount"
      ></h3>

      <div
        class="value"
        id="val-moms"
      >
        0
      </div>

      <div
        class="sub-value"
        data-i18n="sowCountNote"
      ></div>

    </div>


    <div class="card">

      <h3
        data-i18n="fatteningCount"
      ></h3>

      <div
        class="value"
        id="val-fattening"
      >
        0
      </div>

      <div
        class="sub-value"
        data-i18n="fatteningCountNote"
      ></div>

    </div>

  </div>


  <div class="metrics-grid bottom-row">

    <div class="card success">

      <h3
        data-i18n="monthSale"
      ></h3>

      <div
        class="value"
        id="val-month-sale"
      >
        0
      </div>

      <div
        class="sub-value"
        id="month-sale-note"
      ></div>

    </div>


    <div class="card success">

      <h3
        data-i18n="daySale"
      ></h3>

      <div
        class="value"
        id="val-day-sale"
        style="color:#437a22;"
      >
        0
      </div>

      <div
        class="sub-value"
        data-i18n="totalRowBase"
      ></div>

    </div>


    <div class="card danger">

      <h3
        data-i18n="monthLoss"
      ></h3>

      <div
        class="value"
        id="val-month-loss"
        style="color:#a12c7b;"
      >
        0
      </div>

      <div
        class="sub-value"
        id="month-loss-note"
      ></div>

    </div>


    <div class="card danger">

      <h3
        data-i18n="dayLoss"
      ></h3>

      <div
        class="value"
        id="val-day-loss"
        style="color:#a12c7b;"
      >
        0
      </div>

      <div
        class="sub-value"
        data-i18n="totalRowBase"
      ></div>

    </div>

  </div>


  <div class="overview-grid">


    <div class="panel">

      <div class="panel-header">

        <h2
          data-i18n="movementPanelTitle"
        ></h2>

      </div>


      <div class="movement-table-wrap">

        <table class="movement-table">

          <thead>

            <tr>

              <th data-i18n="groupCol"></th>
              <th data-i18n="prevStockCol"></th>
              <th data-i18n="inMoveCol"></th>
              <th data-i18n="outMoveCol"></th>
              <th data-i18n="lossCol"></th>
              <th data-i18n="saleCol"></th>
              <th data-i18n="currentStockCol"></th>

            </tr>

          </thead>


          <tbody
            id="group-movement-body"
          >

            <tr>

              <td
                colspan="7"
                class="empty-message"
              >
                Loading...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>


    <div class="panel">

      <div class="panel-header">

        <h2
          data-i18n="monthlyStatusPanelTitle"
        ></h2>

      </div>


      <div
        class="monthly-status-body"
        id="monthly-status-body"
      >

        <div class="empty-message">
          Loading...
        </div>

      </div>

    </div>

  </div>


  <div
    class="small-note"
    id="main-note"
  ></div>


  <div
    class="debug-box"
    id="debug-box"
  ></div>


  <div
    class="overlay"
    id="overlay"
    onclick="closeSidePanel()"
  ></div>


  <aside
    class="side-panel"
    id="side-panel"
  >

    <div class="side-header">

      <h2
        data-i18n="sideTitle"
      ></h2>

      <button
        class="close-btn"
        onclick="closeSidePanel()"
        data-i18n="closeButton"
      ></button>

    </div>


    <div
      class="side-body"
      id="side-tree"
    >

      <div class="empty-message">
        Loading...
      </div>

    </div>

  </aside>



  <script>

    /* =========================================================

    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }


    function normalizeText(value) {

      return String(
        value ?? ""
      )
        .replace(
          /\u00A0/g,
          " "
        )
        .replace(
          /\s+/g,
          " "
        )
        .trim()
        .toLocaleLowerCase(
          "ru-RU"
        );
    }


    function displayText(value) {

      return String(
        value ?? ""
      )
        .replace(
          /\u00A0/g,
          " "
        )
        .replace(
          /\s+/g,
          " "
        )
        .trim();
    }


    function normalizeRussianDisplayTerm(value) {

      return displayText(
        value
      )
        .replace(
          /свино\s+маток/gi,
          "Свиноматок"
        )
        .replace(
          /\s+/g,
          " "
        )
        .trim();
    }


    function hasCyrillic(value) {

      return (
        /[А-Яа-яЁё]/
          .test(
            String(
              value ?? ""
            )
          )
      );
    }


    function translateTerm(value) {

      const original =
        displayText(
          value
        );


      if (
        getLang() ===
        "ru"
      ) {

        return (
          normalizeRussianDisplayTerm(
            original
          )
        );
      }


      if (!original) {
        return "-";
      }


      const normalized =
        normalizeText(
          original
        );


      if (
        KO_TERM_MAP.has(
          normalized
        )
      ) {

        return (
          KO_TERM_MAP.get(
            normalized
          )
        );
      }


      let translated =
        normalized;


      const entries =
        Array
          .from(
            KO_TERM_MAP.entries()
          )
          .sort(
            function(a,b) {

              return (
                b[0].length -
                a[0].length
              );
            }
          );


      entries.forEach(
        function(entry) {

          translated =
            translated.replaceAll(
              entry[0],
              entry[1]
            );
        }
      );


      translated =
        translated
          .replace(
            /№\s*/g,
            ""
          )
          .replace(
            /ст\.?/g,
            "구사"
          )
          .replace(
            /нов\.?/g,
            "신사"
          )
          .replace(
            /[-_/]+/g,
            " "
          )
          .replace(
            /\s+/g,
            " "
          )
          .trim();


      if (
        !hasCyrillic(
          translated
        )
      ) {

        return (
          translated ||
          original
        );
      }


      return original;
    }


    function num(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return 0;
      }


      const cleaned =
        String(
          value
        )
          .replace(
            /\u00A0/g,
            ""
          )
          .replace(
            /\s/g,
            ""
          )
          .replace(
            /,/g,
            ""
          )
          .replace(
            /[^0-9.-]/g,
            ""
          );


      const n =
        Number(
          cleaned
        );


      return Number.isFinite(
        n
      )
        ? n
        : 0;
    }


    function formatHead(value) {

      return (
        Number(
          value || 0
        ).toLocaleString() +
        " " +
        tr(
          "headUnit"
        )
      );
    }


    function formatSigned(value) {

      const n =
        Number(
          value || 0
        );


      if (n > 0) {

        return (
          "+" +
          n.toLocaleString()
        );
      }


      if (n < 0) {

        return (
          n.toLocaleString()
        );
      }


      return "0";
    }


    /* =========================================================
       날짜
    ========================================================= */

    function parseDateFromValue(value) {

      if (
        value instanceof Date &&
        !isNaN(
          value.getTime()
        )
      ) {

        return new Date(
          value.getFullYear(),
          value.getMonth(),
          value.getDate()
        );
      }


      if (
        typeof value ===
        "number" &&
        value >= 30000 &&
        value <= 60000
      ) {

        const base =
          new Date(
            1899,
            11,
            30
          );


        const date =
          new Date(
            base.getTime() +
            value *
            86400000
          );


        return new Date(
          date.getFullYear(),
          date.getMonth(),
          date.getDate()
        );
      }


      const text =
        String(
          value ?? ""
        ).trim();


      if (!text) {
        return null;
      }


      let match =
        text.match(
          /Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)/
        );


      if (match) {

        return new Date(
          Number(match[1]),
          Number(match[2]),
          Number(match[3])
        );
      }


      match =
        text.match(
          /(20\d{2})[-./년\s]+(\d{1,2})[-./월\s]+(\d{1,2})/
        );


      if (!match) {
        return null;
      }


      return new Date(
        Number(match[1]),
        Number(match[2]) - 1,
        Number(match[3])
      );
    }


    /*
     * 작업일 날짜검색은 A:I에만 한정.
     *
     * K:R의 메타정보 날짜를 작업일로 오인하지 않는다.
     */
    function detectDateFromDataRow(row) {

      if (!row) {
        return null;
      }


      const limit =
        Math.min(
          row.length,
          9
        );


      for (
        let i = 0;
        i < limit;
        i++
      ) {

        const date =
          parseDateFromValue(
            row[i]
          );


        if (date) {
          return date;
        }
      }


      return null;
    }


    function sameDate(a,b) {

      return (
        a &&
        b &&
        a.getFullYear() ===
          b.getFullYear() &&
        a.getMonth() ===
          b.getMonth() &&
        a.getDate() ===
          b.getDate()
      );
    }


    function formatLogDate(date) {

      if (!date) {
        return "-";
      }


      const y =
        date.getFullYear();


      const m =
        String(
          date.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const d =
        String(
          date.getDate()
        ).padStart(
          2,
          "0"
        );


      return (
        getLang() === "ru"
      )
        ? (
            d +
            "." +
            m +
            "." +
            y
          )
        : (
            y +
            "." +
            m +
            "." +
            d
          );
    }

    function clearOldJsonpScripts() {

    function gvizResponseToRows(response) {

      if (
        !response
      ) {

        throw new Error(
          "Google 시트 응답 없음"
        );
      }


      if (
        response.status ===
        "error"
      ) {

        const err =
          response.errors &&
          response.errors.length
            ? response.errors[0]
            : null;


        throw new Error(
          err?.detailed_message ||
          err?.message ||
          err?.reason ||
          "Google 시트 오류"
        );
      }


      if (
        !response.table ||
        !response.table.rows
      ) {

        throw new Error(
          "Google 시트 데이터 없음"
        );
      }


      const colCount =
        response.table.cols
          ? response.table.cols.length
          : 0;


      return response.table.rows.map(
        function(row) {

          const result = [];


          for (
            let i = 0;
            i < colCount;
            i++
          ) {

            const cell =
              row.c &&
              row.c[i]
                ? row.c[i]
                : null;


            if (!cell) {

              result.push("");

              continue;
            }


            if (
              cell.f !== null &&
              cell.f !== undefined
            ) {

              result.push(
                cell.f
              );

              continue;
            }


            if (
              cell.v !== null &&
              cell.v !== undefined
            ) {

              result.push(
                cell.v
              );

              continue;
            }


            result.push("");
          }


          return result;
        }
      );
    }


    function loadGvizRowsBySheetRange(
      sheetName,
      range,
      requestLabel
    ) {

      return new Promise(
        function(resolve,reject) {

          const callbackName =
            "dashboard_range_" +
            Date.now() +
            "_" +
            Math.floor(
              Math.random() *
              100000
            );


          const timer =
            setTimeout(
              function() {

                cleanup();

                reject(
                  new Error(
                    requestLabel +
                    " 응답 시간 초과"
                  )
                );

              },
              15000
            );


          function cleanup() {

            clearTimeout(
              timer
            );


            const script =
              document.getElementById(
                callbackName
              );


            if (script) {
              script.remove();
            }


            try {

              delete window[
                callbackName
              ];

            } catch(e) {

              window[
                callbackName
              ] = undefined;
            }
          }


          window[
            callbackName
          ] =
            function(response) {

              try {

                const rows =
                  gvizResponseToRows(
                    response
                  );


                cleanup();

                resolve(rows);

              } catch(err) {

                cleanup();

                reject(err);
              }
            };


          const tqx =
            encodeURIComponent(
              "out:json;responseHandler:" +
              callbackName
            );


          const url =

            "https://docs.google.com/spreadsheets/d/" +

            encodeURIComponent(
              SHEET_ID
            ) +

            "/gviz/tq?tqx=" +

            tqx +

            "&headers=0&sheet=" +

            encodeURIComponent(
              sheetName
            ) +

            "&range=" +

            encodeURIComponent(
              range
            ) +

            "&t=" +

            Date.now();


          const script =
            document.createElement(
              "script"
            );


          script.id =
            callbackName;

          script.dataset.gvizScript =
            "true";

          script.src =
            url;


          script.onerror =
            function() {

              cleanup();

              reject(
                new Error(
                  requestLabel +
                  " 로딩 실패"
                )
              );
            };


          document.body.appendChild(
            script
          );
        }
      );
    }

    function findMetadataValue(
      lines,
      label
    ) {

      const maxRows =
        Math.min(
          lines.length,
          12
        );


      for (
        let r = 0;
        r < maxRows;
        r++
      ) {

        const row =
          lines[r] ||
          [];


        for (
          let c = 0;
          c < row.length - 1;
          c++
        ) {

          if (
            displayText(
              row[c]
            ) === label
          ) {

            return (
              row[
                c + 1
              ]
            );
          }
        }
      }


      return null;
    }


    function readSingleCellValue(
      lines
    ) {

      for (
        let r = 0;
        r < lines.length;
        r++
      ) {

        const row =
          lines[r] ||
          [];


        for (
          let c = 0;
          c < row.length;
          c++
        ) {

          if (
            row[c] !== null &&
            row[c] !== undefined &&
            displayText(
              row[c]
            ) !== ""
          ) {

    /*
     * 별도 조회한 연간연동용 K1:O30의 월별 집계표만 읽는다.
     *
     * HTML에서 원본 ВСЕГО를 다시 합산하지 않는다.
     * 문자열 표식이 GViz 열 형식 추론으로 비어도,
     * 연도/월 숫자행은 그대로 남으므로 해당 행만 선별한다.
     */
    function readAnnualMonthlySummary(
      lines
    ) {

      const result = [];


      for (
        let r = 0;
        r < lines.length;
        r++
      ) {

        const row =
          lines[r] ||
          [];


        const year =
          num(
            row[0]
          );


        const month =
          num(
            row[1]
          );


        if (
          year < 2000 ||
          year > 2100 ||
          month < 1 ||
          month > 12
        ) {

          continue;
        }


        result.push({

          year:
            year,

          month:
            month,

          sale:
            num(
              row[2]
            ),

          loss:
            num(
              row[3]
            ),

          validDays:
            num(
              row[4]
            )
        });
      }


      return result.sort(
        function(a,b) {

          return (
            (
              a.year * 12 +
              a.month
            ) -
            (
              b.year * 12 +
              b.month
            )
          );
        }
      );
    }

       최신 유효 날짜 블록만 사용
    ========================================================= */

    function getRowsForDate(
      lines,
      targetDate
    ) {

      if (!targetDate) {
        return [];
      }


      const result = [];

      let currentDate =
        null;

      let inside =
        false;


      lines.forEach(
        function(row) {

          if (!row) {
            return;
          }


          const foundDate =
            detectDateFromDataRow(
              row
            );


          if (foundDate) {

            currentDate =
              foundDate;


            inside =
              sameDate(
                currentDate,
                targetDate
              );
          }


          if (
            inside &&
            row.length >= 9
          ) {

            result.push(
              row
            );
          }
        }
      );


      return result;
    }


    /* =========================================================
       돈군 데이터
    ========================================================= */

    function isTotalLabel(value) {

      const v =
        normalizeText(
          value
        );


      return (
        v === "итого" ||
        v === "итог" ||
        v === "всего" ||
        v === "total" ||
        v === "subtotal" ||
        v === "합계" ||
        v === "총계"
      );
    }


    function isGrandTotalLabel(value) {

      const v =
        normalizeText(
          value
        );


      return (
        v === "всего" ||
        v === "total" ||
        v === "총계"
      );
    }


    function isSowText(value) {

      const v =
        normalizeText(
          value
        );


      return (
        v.includes(
          "свиномат"
        ) ||
        v.includes(
          "свино маток"
        )
      );
    }


    function hasAnyNumericValue(row) {

      if (
        !row ||
        row.length < 9
      ) {
        return false;
      }


      return (
        num(
          row[COL_PREVIOUS]
        ) !== 0 ||
        num(
          row[COL_IN]
        ) !== 0 ||
        num(
          row[COL_OUT]
        ) !== 0 ||
        num(
          row[COL_LOSS]
        ) !== 0 ||
        num(
          row[COL_SALE]
        ) !== 0 ||
        num(
          row[COL_CURRENT]
        ) !== 0
      );
    }


    function buildDetailRows(lines) {

      const result = [];

      const seen =
        new Set();

      let currentSection =
        "";

      let insideTotalBlock =
        false;


      lines.forEach(
        function(row,index) {

          if (
            !row ||
            row.length < 9
          ) {
            return;
          }


          const rawSection =
            displayText(
              row[
                COL_SECTION
              ]
            );


          const rawSub =
            displayText(
              row[
                COL_SUB
              ]
            );


          if (rawSection) {

            if (
              isTotalLabel(
                rawSection
              )
            ) {

              insideTotalBlock =
                true;

              return;
            }


            currentSection =
              rawSection;

            insideTotalBlock =
              false;

          } else if (
            insideTotalBlock
          ) {

            return;
          }


          if (!currentSection) {
            return;
          }


          if (
            isTotalLabel(
              rawSub
            )
          ) {

            return;
          }


          if (
            !hasAnyNumericValue(
              row
            )
          ) {

            return;
          }


          const item = {

            rowIndex:
              index + 1,

            section:
              currentSection,

            sub:
              rawSub ||
              "-",

            previous:
              num(
                row[
                  COL_PREVIOUS
                ]
              ),

            incoming:
              num(
                row[
                  COL_IN
                ]
              ),

            outgoing:
              num(
                row[
                  COL_OUT
                ]
              ),

            loss:
              num(
                row[
                  COL_LOSS
                ]
              ),

            sale:
              num(
                row[
                  COL_SALE
                ]
              ),

            current:
              num(
                row[
                  COL_CURRENT
                ]
              )
          };


          const key = [

            normalizeText(
              item.section
            ),

            normalizeText(
              item.sub
            ),

            item.previous,
            item.incoming,
            item.outgoing,
            item.loss,
            item.sale,
            item.current

          ].join("|");


          if (
            seen.has(
              key
            )
          ) {

            return;
          }


          seen.add(
            key
          );


          result.push(
            item
          );
        }
      );


      return result;
    }


    function buildSowSummaryFromLines(
      lines
    ) {

      let currentSection =
        "";

      let totalCandidate =
        null;


      const sum = {

        key:"sow",
        labelKey:"groupSow",
        order:5,

        previous:0,
        incoming:0,
        outgoing:0,
        loss:0,
        sale:0,
        current:0,
        count:0
      };


      lines.forEach(
        function(row) {

          if (
            !row ||
            row.length < 9
          ) {
            return;
          }


          const sec =
            displayText(
              row[
                COL_SECTION
              ]
            );


          const sub =
            displayText(
              row[
                COL_SUB
              ]
            );


          if (
            sec &&
            !isTotalLabel(
              sec
            )
          ) {

            currentSection =
              sec;
          }


          const sowContext =
            isSowText(
              currentSection
            ) ||
            isSowText(
              sec
            ) ||
            isSowText(
              sub
            );


          if (!sowContext) {
            return;
          }


          const isSubtotal =
            (
              normalizeText(sec) ===
                "итого" ||
              normalizeText(sub) ===
                "итого"
            );


          const record = {

            key:"sow",
            labelKey:"groupSow",
            order:5,

            previous:
              num(
                row[
                  COL_PREVIOUS
                ]
              ),

            incoming:
              num(
                row[
                  COL_IN
                ]
              ),

            outgoing:
              num(
                row[
                  COL_OUT
                ]
              ),

            loss:
              num(
                row[
                  COL_LOSS
                ]
              ),

            sale:
              num(
                row[
                  COL_SALE
                ]
              ),

            current:
              num(
                row[
                  COL_CURRENT
                ]
              ),

            count:1
          };


          if (isSubtotal) {

            if (
              record.current > 0
            ) {

              totalCandidate =
                record;
            }

            return;
          }


          if (
            isGrandTotalLabel(sec) ||
            isGrandTotalLabel(sub)
          ) {

            return;
          }


          if (
            !hasAnyNumericValue(
              row
            )
          ) {

            return;
          }


          sum.previous +=
            record.previous;

          sum.incoming +=
            record.incoming;

          sum.outgoing +=
            record.outgoing;

          sum.loss +=
            record.loss;

          sum.sale +=
            record.sale;

          sum.current +=
            record.current;

          sum.count +=
            1;
        }
      );


      if (
        totalCandidate &&
        totalCandidate.current > 0
      ) {

        return (
          totalCandidate
        );
      }


      if (
        sum.count > 0
      ) {

        return sum;
      }


      return null;
    }


    function classifyGroup(
      section,
      sub
    ) {

      const sec =
        normalizeText(
          section
        );


      const subText =
        normalizeText(
          sub
        );


      for (
        const rule of
        GROUP_RULES
      ) {

        if (
          rule.match(
            sec,
            subText
          )
        ) {

          return rule;
        }
      }


      return null;
    }


    function makeEmptyGroup(
      rule
    ) {

      return {

        key:
          rule.key,

        labelKey:
          rule.labelKey,

        order:
          rule.order,

        previous:0,
        incoming:0,
        outgoing:0,
        loss:0,
        sale:0,
        current:0,
        count:0
      };
    }


    function buildGroupSummary(
      detailRows,
      latestLogRows
    ) {

      const groups =
        new Map();


      GROUP_RULES
        .slice()
        .sort(
          function(a,b) {

            return (
              a.order -
              b.order
            );
          }
        )
        .forEach(
          function(rule) {

            groups.set(
              rule.key,
              makeEmptyGroup(
                rule
              )
            );
          }
        );


      detailRows.forEach(
        function(item) {

          const rule =
            classifyGroup(
              item.section,
              item.sub
            );


          if (!rule) {
            return;
          }


          const group =
            groups.get(
              rule.key
            );


          group.previous +=
            item.previous;

          group.incoming +=
            item.incoming;

          group.outgoing +=
            item.outgoing;

          group.loss +=
            item.loss;

          group.sale +=
            item.sale;

          group.current +=
            item.current;

          group.count +=
            1;
        }
      );


      const sowSummary =
        buildSowSummaryFromLines(
          latestLogRows
        );


      if (sowSummary) {

        groups.set(
          "sow",
          sowSummary
        );
      }


      return Array
        .from(
          groups.values()
        )
        .filter(
          function(group) {

            return (
              group.previous !== 0 ||
              group.incoming !== 0 ||
              group.outgoing !== 0 ||
              group.loss !== 0 ||
              group.sale !== 0 ||
              group.current !== 0 ||
              group.count > 0
            );
          }
        )
        .sort(
          function(a,b) {

            return (
              a.order -
              b.order
            );
          }
        );
    }

    function buildAnnualStats(
      monthlyRows
    ) {

      if (
        !monthlyRows ||
        !monthlyRows.length
      ) {

        return null;
      }


      const current =
        monthlyRows[
          monthlyRows.length - 1
        ];


      let previousYear =
        current.year;


      let previousMonth =
        current.month - 1;


      if (
        previousMonth === 0
      ) {

        previousMonth =
          12;

        previousYear -=
          1;
      }


      const previous =
        monthlyRows.find(
          function(item) {

            return (
              item.year ===
                previousYear &&
              item.month ===
                previousMonth
            );
          }
        ) ||
        null;


      const yearRows =
        monthlyRows.filter(
          function(item) {

            return (
              item.year ===
              current.year
            );
          }
        );


      return {

        current:
          current,

        previous:
          previous,

        previousYear:
          previousYear,

        previousMonth:
          previousMonth,

        yearSale:
          yearRows.reduce(
            function(sum,item) {

              return (
                sum +
                item.sale
              );
            },
            0
          ),

        yearLoss:
          yearRows.reduce(
            function(sum,item) {

              return (
                sum +
                item.loss
              );
            },
            0
          ),

        chartMonths:
          yearRows
      };
    }


    function formatDelta(
      current,
      previous,
      type
    ) {

      if (
        previous === null ||
        previous === undefined
      ) {

        return {
          text:"-",
          className:"delta-neutral"
        };
      }


      const diff =
        current -
        previous;


      if (
        diff === 0
      ) {

        return {

          text:
            "0 " +
            tr(
              "headUnit"
            ),

          className:
            "delta-neutral"
        };
      }


      const good =
        type === "sale"
          ? diff > 0
          : diff < 0;


      return {

        text:
          (
            diff > 0
              ? "+"
              : ""
          ) +
          diff.toLocaleString() +
          " " +
          tr(
            "headUnit"
          ),

        className:
          good
            ? "delta-good"
            : "delta-bad"
      };
    }

    /* =========================================================
       그래프
    ========================================================= */

    function renderMonthlyChart(
      months
    ) {

      const target =
        document.getElementById(
          "monthly-chart"
        );


      if (
        !target ||
        !months ||
        !months.length
      ) {
        return;
      }


      const data =
        months.slice(
          -12
        );


      const width = 620;
      const height = 225;

      const left = 48;
      const right = 48;

      const top = 24;
      const bottom = 38;


      const chartWidth =
        width -
        left -
        right;


      const chartHeight =
        height -
        top -
        bottom;


      const maxSale =
        Math.max(
          1,
          ...data.map(
            function(item) {

              return (
                item.sale
              );
            }
          )
        );


      const maxLoss =
        Math.max(
          1,
          ...data.map(
            function(item) {

              return (
                item.loss
              );
            }
          )
        );


      const groupWidth =
        chartWidth /
        data.length;


      let bars = "";

      const points = [];

      let dots = "";

      let labels = "";


      data.forEach(
        function(item,index) {

          const x =
            left +
            groupWidth *
            index +
            groupWidth /
            2;


          const saleHeight =
            item.sale /
            maxSale *
            chartHeight;


          const saleY =
            top +
            chartHeight -
            saleHeight;


          bars += `

            <rect
              x="${x - 14}"
              y="${saleY}"
              width="28"
              height="${saleHeight}"
              rx="3"
              fill="#4f6fe8"
            ></rect>
          `;


          const lossY =
            top +
            chartHeight -
            (
              item.loss /
              maxLoss *
              chartHeight
            );


          points.push(
            x +
            "," +
            lossY
          );


          dots += `

            <circle
              cx="${x}"
              cy="${lossY}"
              r="4"
              fill="#e74c3c"
            ></circle>
          `;


          labels += `

            <text
              x="${x}"
              y="${height - 13}"
              text-anchor="middle"
              font-size="10"
              fill="#666"
            >
              ${item.month}
            </text>
          `;
        }
      );


      target.innerHTML = `

        <svg
          class="monthly-chart-svg"
          viewBox="0 0 ${width} ${height}"
        >

          <line
            x1="${left}"
            y1="${top + chartHeight}"
            x2="${width - right}"
            y2="${top + chartHeight}"
            stroke="#cfd5df"
          ></line>


          <line
            x1="${left}"
            y1="${top}"
            x2="${left}"
            y2="${top + chartHeight}"
            stroke="#cfd5df"
          ></line>


          <line
            x1="${width - right}"
            y1="${top}"
            x2="${width - right}"
            y2="${top + chartHeight}"
            stroke="#cfd5df"
          ></line>


          <text
            x="${left - 5}"
            y="${top + 4}"
            text-anchor="end"
            font-size="9"
            fill="#4f6fe8"
          >
            ${maxSale}
          </text>


          <text
            x="${width - right + 5}"
            y="${top + 4}"
            font-size="9"
            fill="#e74c3c"
          >
            ${maxLoss}
          </text>


          ${bars}


          <polyline
            points="${points.join(" ")}"
            fill="none"
            stroke="#e74c3c"
            stroke-width="2.8"
          ></polyline>


          ${dots}

          ${labels}

        </svg>
      `;
    }


    /* =========================================================
       메인 렌더
    ========================================================= */

    function renderDashboard(
      lines,
      metaLines,
      dateLines,
      sourceUsed
    ) {

      latestRows =
        lines;


      latestMetaRows =
        metaLines;


      latestDateRows =
        dateLines;


      latestSourceUsed =
        sourceUsed;


      applyStaticTexts();


      /*
       * 모든 KPI는 Apps Script가 계산한 메타정보.
       */
      const meta =
        readMonthlyMetadata(
          metaLines,
          dateLines
        );


      if (
        !meta.latestDate
      ) {

        throw new Error(
          "Apps Script 최신 유효일 메타정보를 찾지 못했습니다."
        );
      }


      /*
       * 원본 상세표는
       * GS가 확정한 최신 유효일 날짜와 정확히 같은 블록만 읽는다.
       *
       * 이것은 유효일 판정이 아니다.
       */
      const latestLogRows =
        getRowsForDate(
          lines,
          meta.latestDate
        );


      const detailRows =
        buildDetailRows(
          latestLogRows
        );


      const groups =
        buildGroupSummary(
          detailRows,
          latestLogRows
        );


      const fattening =
        groups.find(
          function(group) {

            return (
              group.key ===
              "fattening"
            );
          }
        );


      /*
       * KPI 표시
       */

      document.getElementById(
        "val-msy"
      ).textContent =
        meta.msy !== null
          ? meta.msy.toFixed(2)
          : "-";


      document.getElementById(
        "val-total"
      ).textContent =
        formatHead(
          meta.totalPigs
        );


      document.getElementById(
        "val-moms"
      ).textContent =
        formatHead(
          meta.sowCount
        );


      document.getElementById(
        "val-fattening"
      ).textContent =
        formatHead(
          fattening
            ? fattening.current
            : 0
        );


      document.getElementById(
        "val-month-sale"
      ).textContent =
        formatHead(
          meta.monthSale
        );


      document.getElementById(
        "val-day-sale"
      ).textContent =
        formatHead(
          meta.daySale
        );


      document.getElementById(
        "val-month-loss"
      ).textContent =
        formatHead(
          meta.monthLoss
        );


      document.getElementById(
        "val-day-loss"
      ).textContent =
        formatHead(
          meta.dayLoss
        );


      const y =
        meta.latestDate
          .getFullYear();


      const m =
        String(
          meta.latestDate
            .getMonth() +
          1
        ).padStart(
          2,
          "0"
        );


      const monthNote =
        getLang() === "ru"
          ? (
              m +
              "." +
              y +
              " · " +
              meta.validDays +
              " дн."
            )
          : (
              y +
              "." +
              m +
              " 누적 · " +
              meta.validDays +
              "개 일지"
            );


      document.getElementById(
        "month-sale-note"
      ).textContent =
        monthNote;


      document.getElementById(
        "month-loss-note"
      ).textContent =
        monthNote;


      document.getElementById(
        "latest-log-date"
      ).textContent =
        tr(
          "journalDate"
        ) +
        ": " +
        formatLogDate(
          meta.latestDate
        );


      renderMovementTable(
        groups
      );


      renderSideTree(
        detailRows
      );


      const sourceText =
        sourceUsed;


      document.getElementById(
        "debug-box"
      ).innerHTML = `

        연결 성공<br>

        사용 시트:
        ${escapeHtml(
          sourceText
        )}<br>

        최신 유효 작업일:
        ${escapeHtml(
          formatLogDate(
            meta.latestDate
          )
        )}<br>

        월 유효 작업일:
        ${meta.validDays.toLocaleString()}일<br>

        월누적 출하:
        ${meta.monthSale.toLocaleString()}
        ${escapeHtml(
          tr("headUnit")
        )}<br>

        월누적 폐사:
        ${meta.monthLoss.toLocaleString()}
        ${escapeHtml(
          tr("headUnit")
        )}<br>

        MSY 유효 작업일:
        ${meta.msyValidDays.toLocaleString()}일<br>

        MSY 누적 출하:
        ${meta.msySale.toLocaleString()}
        ${escapeHtml(
          tr("headUnit")
        )}<br>

        MSY 평균 모돈:
        ${meta.msyAvgSow.toFixed(1)}
        ${escapeHtml(
          tr("headUnit")
        )}<br>

        MSY 누적 달력일:
        ${meta.msyElapsedDays.toLocaleString()}일<br>

        누적 예상 MSY:
        ${
          meta.msy !== null
            ? meta.msy.toFixed(2)
            : "-"
        }<br>

        MSY 상태:
        ${escapeHtml(
          meta.msyStatus ||
          "-"
        )}<br>

        HTML 유효 작업일 판정:
        없음<br>

        유효 작업일 판정:
        Apps Script 원본 월작업일지 전담
      `;


      document.getElementById(
        "status-bar"
      ).className =
        "status-bar success";


      document.getElementById(
        "status-text"
      ).textContent =
        tr(
          "statusSuccess"
        ) +
        " · " +
        sourceText +
        " · " +
        tr(
          "journalDate"
        ) +
        " " +
        formatLogDate(
          meta.latestDate
        );


      return true;
    }


    /* =========================================================
       연간현황 로드
    ========================================================= */

    async function loadAnnualStatus(
      annualRows
    ) {

      try {

        latestAnnualRows =
          annualRows;


        const summaryRows =
          readAnnualMonthlySummary(
            latestAnnualRows
          );


        latestAnnualStats =
          buildAnnualStats(
            summaryRows
          );


        renderMonthlyStatus(
          latestAnnualStats
        );


      } catch(err) {

        console.error(
          err
        );


        document.getElementById(
          "monthly-status-body"
        ).innerHTML = `

          <div
            class="empty-message"
            style="color:#a12c2c;font-weight:800;"
          >
            연간연동용 데이터를 불러오지 못했습니다.

            <br><br>

            ${escapeHtml(
              err.message
            )}
          </div>
        `;
      }
    }


    /* =========================================================
       로딩 상태
    ========================================================= */

    function setLoadingState(
      loading
    ) {

      const button =
        document.getElementById(
          "btn-sync"
        );


      if (loading) {

        button.disabled =
          true;


        button.textContent =
          tr(
            "loadingButton"
          );

      } else {

        button.disabled =
          false;


        button.textContent =
          tr(
            "updateButton"
          );
      }
    }


    function nowText() {

      return new Date()
        .toLocaleString(
          getLang() === "ru"
            ? "ru-RU"
            : "ko-KR"
        );
    }


    /* =========================================================
       전체 로드
    ========================================================= */

    async function loadPigsData() {

      setLoadingState(
        true
      );


      document.getElementById(
        "status-bar"
      ).className =
        "status-bar";


      document.getElementById(
        "status-text"
      ).textContent =
        tr(
          "statusLoading"
        );


      document.getElementById(
        "status-time"
      ).textContent =
        tr(
          "lastUpdated"
        ) +
        ": -";


      document.getElementById(
        "monthly-status-body"
      ).innerHTML =
        '<div class="empty-message">Loading...</div>';


      clearOldJsonpScripts();


      try {

        const results =
          await Promise.all([

            loadGvizRowsBySheetRange(
              MONTHLY_LINK_SHEET_NAME,
              MONTHLY_DATA_RANGE,
              "월간 작업일지 요청"
            ),

            loadGvizRowsBySheetRange(
              MONTHLY_LINK_SHEET_NAME,
              MONTHLY_META_RANGE,
              "월간 메타 요청"
            ),

            loadGvizRowsBySheetRange(
              MONTHLY_LINK_SHEET_NAME,
              MONTHLY_LATEST_DATE_RANGE,
              "최신 유효일 요청"
            ),

            loadGvizRowsBySheetRange(
              ANNUAL_LINK_SHEET_NAME,
              ANNUAL_SUMMARY_RANGE,
              "연간 집계 요청"
            )
          ]);


        const monthlyDataRows =
          results[0];


        const monthlyMetaRows =
          results[1];


        const monthlyLatestDateRows =
          results[2];


        const annualSummaryRows =
          results[3];


        const sourceText =
          MONTHLY_LINK_SHEET_NAME +
          "!" +
          MONTHLY_DATA_RANGE;


        renderDashboard(
          monthlyDataRows,
          monthlyMetaRows,
          monthlyLatestDateRows,
          sourceText
        );


        await loadAnnualStatus(
          annualSummaryRows
        );


        document.getElementById(
          "status-time"
        ).textContent =
          tr(
            "lastUpdated"
          ) +
          ": " +
          nowText();


      } catch(err) {

        console.error(
          err
        );


        document.getElementById(
          "status-bar"
        ).className =
          "status-bar error";


        document.getElementById(
          "status-text"
        ).textContent =
          tr(
            "statusError"
          );


        document.getElementById(
          "debug-box"
        ).innerHTML = `

          오류:
          ${escapeHtml(
            err.message
          )}

          <br><br>

          월간 작업일지 요청:
          ${escapeHtml(
            MONTHLY_LINK_SHEET_NAME +
            "!" +
            MONTHLY_DATA_RANGE
          )}<br>

          월간 메타 요청:
          ${escapeHtml(
            MONTHLY_LINK_SHEET_NAME +
            "!" +
            MONTHLY_META_RANGE
          )}<br>

          최신 유효일 요청:
          ${escapeHtml(
            MONTHLY_LINK_SHEET_NAME +
            "!" +
            MONTHLY_LATEST_DATE_RANGE
          )}<br>

          연간 집계 요청:
          ${escapeHtml(
            ANNUAL_LINK_SHEET_NAME +
            "!" +
            ANNUAL_SUMMARY_RANGE
          )}<br><br>

          연결 방식:
          시트명 + 범위 직접 지정
        `;


      } finally {

        setLoadingState(
          false
        );
      }
    }


    /* =========================================================
       상세 패널
    ========================================================= */

    function openSidePanel() {

      document.getElementById(
        "overlay"
      ).classList.add(
        "open"
      );


      document.getElementById(
        "side-panel"
      ).classList.add(
        "open"
      );
    }


    function closeSidePanel() {

      document.getElementById(
        "overlay"
      ).classList.remove(
        "open"
      );


      document.getElementById(
        "side-panel"
      ).classList.remove(
        "open"
      );
    }


    function toggleTreeGroup(id) {

      const element =
        document.getElementById(
          id
        );


      if (element) {

        element.classList.toggle(
          "open"
        );
      }
    }


    /* =========================================================
       초기화
    ========================================================= */

    function initializeDashboard() {

      setLang(
        getLang()
      );


      applyStaticTexts();


      document.getElementById(
        "status-text"
      ).textContent =
        tr(
          "statusWaiting"
        );


      document.getElementById(
        "status-time"
      ).textContent =
        tr(
          "lastUpdated"
        ) +
        ": -";


      document.getElementById(
        "latest-log-date"
      ).textContent =
        tr(
          "journalDate"
        ) +
        ": -";


      loadPigsData();
    }


    window.addEventListener(
      "load",
      initializeDashboard
    );


  </script>
