<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>양돈장 실시간 대시보드</title>

  <style>
    :root {
      --main: #01696f;
      --main-dark: #0c4e54;
      --success: #22a06b;
      --danger: #e74c3c;
      --danger-dark: #a12c2c;
      --bg: #f4f6f9;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #222222;
      --muted: #666666;
      --blue: #4f6fe8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }

    .status-bar {
      min-height: 32px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .status-bar.success {
      background: #3a7d1f;
    }

    .status-bar.error {
      background: var(--danger-dark);
    }

    .status-left {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .status-right {
      font-size: 0.78rem;
      opacity: 0.9;
      white-space: nowrap;
    }

    .dashboard-title {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title-wrap {
      min-width: 260px;
      flex: 1;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .dashboard-title h1 {
      margin: 0;
      color: var(--main);
      font-size: 1.35rem;
    }

    .log-date-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eef7f0;
      color: #3a7d1f;
      border: 1px solid #cfe6d2;
      font-size: 0.86rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 4px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .language-select {
      height: 40px;
      padding: 0 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--main);
      cursor: pointer;
    }

    .btn {
      background: var(--main);
      color: #ffffff;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--main-dark);
    }

    .btn:disabled {
      background: #999999;
      cursor: wait;
    }

    .btn.secondary {
      background: #34495e;
    }

    .btn.secondary:hover {
      background: #243342;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .metrics-grid.bottom-row {
      margin-bottom: 14px;
    }

    .card {
      background: var(--card);
      padding: 14px 16px;
      border-radius: 12px;
      border-left: 5px solid var(--main);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      min-height: 96px;
    }

    .card.danger {
      border-left-color: #c0392b;
    }

    .card.success {
      border-left-color: #3a7d1f;
    }

    .card h3 {
      margin: 0 0 8px 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .card .value {
      font-size: 1.75rem;
      font-weight: 800;
      color: #111111;
      line-height: 1.1;
    }

    .card .sub-value {
      margin-top: 5px;
      font-size: 0.78rem;
      color: #777777;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 16px;
      margin-bottom: 12px;
    }

    .panel {
      background: var(--card);
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      margin-bottom: 12px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #eef1f6;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .panel h2 {
      margin: 0;
      color: #4b5563;
      font-size: 1.1rem;
      font-weight: 900;
    }

    .movement-table-wrap {
      overflow-x: auto;
    }

    .movement-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.96rem;
    }

    .movement-table th {
      background: #f5f7fb;
      color: var(--blue);
      padding: 14px 10px;
      font-weight: 900;
      border-bottom: 2px solid #d9dee8;
      white-space: nowrap;
    }

    .movement-table td {
      padding: 16px 10px;
      border-bottom: 1px solid #edf0f5;
      font-size: 0.96rem;
    }

    .movement-table .row-name {
      text-align: left;
      font-weight: 900;
      font-size: 0.98rem;
      color: #1f2937;
      min-width: 170px;
      line-height: 1.35;
    }

    .movement-table .current-strong {
      font-weight: 900;
      font-size: 1rem;
      color: #1f2937;
    }

    .positive-text {
      color: #119c2b;
      font-weight: 900;
    }

    .negative-text {
      color: #f39c12;
      font-weight: 900;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 999px;
      color: #ffffff;
      font-weight: 900;
      font-size: 1rem;
      line-height: 1;
    }

    .pill.red {
      background: #e74c3c;
    }

    .pill.green {
      background: #28c17b;
    }

    .composition-body {
      min-height: 360px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .composition-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    .composition-table th {
      background: #f5f7fb;
      color: var(--blue);
      padding: 12px 10px;
      font-weight: 900;
      border-bottom: 2px solid #d9dee8;
      text-align: center;
      white-space: nowrap;
    }

    .composition-table td {
      padding: 13px 10px;
      border-bottom: 1px solid #edf0f5;
      text-align: center;
    }

    .composition-table .group-name {
      text-align: left;
      font-weight: 900;
      color: #1f2937;
    }

    .composition-table .head-count {
      font-weight: 900;
      color: #111827;
    }

    .composition-table .percent {
      font-weight: 900;
      color: #4b5563;
    }

    .composition-summary {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 900;
      color: #111827;
    }

    .small-note {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 8px;
      text-align: center;
    }

    .debug-box {
      margin-top: 10px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 0.78rem;
      color: #666666;
      line-height: 1.5;
      display: none;
      word-break: break-all;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      z-index: 998;
    }

    .overlay.open {
      display: block;
    }

    .side-panel {
      position: fixed;
      top: 0;
      left: -760px;
      width: 720px;
      max-width: 94vw;
      height: 100vh;
      background: #ffffff;
      box-shadow: 4px 0 18px rgba(0,0,0,0.22);
      z-index: 999;
      transition: left 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .side-panel.open {
      left: 0;
    }

    .side-header {
      padding: 14px;
      background: var(--main);
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .side-header h2 {
      margin: 0;
      font-size: 1rem;
      color: #ffffff;
    }

    .close-btn {
      border: none;
      background: rgba(255,255,255,0.18);
      color: #ffffff;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 800;
    }

    .side-body {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
      background: #f8fafc;
    }

    .tree-group {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .tree-title {
      padding: 11px 12px;
      cursor: pointer;
      font-weight: 800;
      color: var(--main);
      background: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .tree-title:hover {
      background: #f1f5f9;
    }

    .tree-content {
      display: none;
      padding: 0 10px 10px 10px;
      border-top: 1px solid var(--line);
    }

    .tree-group.open .tree-content {
      display: block;
    }

    .detail-table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.78rem;
    }

    .detail-table th,
    .detail-table td {
      padding: 6px 5px;
      border-bottom: 1px solid #eeeeee;
    }

    .detail-table th {
      background: #f8f9fa;
      color: var(--main);
      font-weight: 800;
    }

    .text-left {
      text-align: left;
      font-weight: 700;
    }

    .number-strong {
      font-weight: 800;
      color: #111111;
    }

    .danger-text {
      color: #d63e2f;
      font-weight: 800;
    }

    .success-text {
      color: #22a06b;
      font-weight: 800;
    }

    .empty-message {
      color: #999999;
      padding: 28px;
      text-align: center;
    }

    @media (max-width: 1200px) {
      .overview-grid {
        grid-template-columns: 1fr;
      }

      .composition-body {
        min-height: 240px;
      }
    }

    @media (max-width: 900px) {
      .metrics-grid {
        grid-template-columns: repeat(2, minmax(140px, 1fr));
      }

      .dashboard-title {
        align-items: flex-start;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 8px;
      }

      .metrics-grid {
        grid-template-columns: 1fr;
      }

      .status-bar {
        height: auto;
        line-height: 1.3;
        padding: 9px 12px;
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
      }

      .language-select,
      .btn {
        width: 100%;
      }

      .movement-table .row-name {
        min-width: 150px;
      }
    }
  </style>
</head>

<body>
  <div class="status-bar" id="status-bar">
    <div class="status-left" id="status-text"></div>
    <div class="status-right" id="status-time"></div>
  </div>

  <div class="dashboard-title">
    <div class="title-wrap">
      <div class="title-row">
        <h1 data-i18n="dashboardTitle"></h1>
        <span class="log-date-badge" id="latest-log-date"></span>
      </div>
      <div class="subtitle" data-i18n="subtitle"></div>
    </div>

    <div class="top-actions">
      <select class="language-select" id="language-select" onchange="changeLanguage(this.value)">
        <option value="ko">한국어</option>
        <option value="ru">Русский</option>
      </select>

      <button class="btn secondary" onclick="openSidePanel()" data-i18n="detailButton"></button>
      <button class="btn" id="btn-sync" onclick="loadPigsData()" data-i18n="updateButton"></button>
    </div>
  </div>

  <div class="metrics-grid top-row">
    <div class="card">
      <h3 data-i18n="estimatedMsy"></h3>
      <div class="value" id="val-msy">0.00</div>
      <div class="sub-value" data-i18n="estimatedMsyNote"></div>
    </div>

    <div class="card">
      <h3 data-i18n="totalPigs"></h3>
      <div class="value" id="val-total">0</div>
      <div class="sub-value" data-i18n="totalPigsNote"></div>
    </div>

    <div class="card">
      <h3 data-i18n="sowCount"></h3>
      <div class="value" id="val-moms">0</div>
      <div class="sub-value" data-i18n="sowCountNote"></div>
    </div>

    <div class="card">
      <h3 data-i18n="fatteningCount"></h3>
      <div class="value" id="val-fattening">0</div>
      <div class="sub-value" data-i18n="fatteningCountNote"></div>
    </div>
  </div>

  <div class="metrics-grid bottom-row">
    <div class="card success">
      <h3 data-i18n="monthSale"></h3>
      <div class="value" id="val-month-sale">0</div>
      <div class="sub-value" id="month-sale-note"></div>
    </div>

    <div class="card success">
      <h3 data-i18n="daySale"></h3>
      <div class="value" id="val-day-sale" style="color:#437a22;">0</div>
      <div class="sub-value" data-i18n="totalRowBase"></div>
    </div>

    <div class="card danger">
      <h3 data-i18n="monthLoss"></h3>
      <div class="value" id="val-month-loss" style="color:#a12c7b;">0</div>
      <div class="sub-value" id="month-loss-note"></div>
    </div>

    <div class="card danger">
      <h3 data-i18n="dayLoss"></h3>
      <div class="value" id="val-day-loss" style="color:#a12c7b;">0</div>
      <div class="sub-value" data-i18n="totalRowBase"></div>
    </div>
  </div>

  <div class="overview-grid">
    <div class="panel">
      <div class="panel-header">
        <h2 data-i18n="movementPanelTitle"></h2>
      </div>

      <div class="movement-table-wrap">
        <table class="movement-table">
          <thead>
            <tr>
              <th data-i18n="groupCol"></th>
              <th data-i18n="prevStockCol"></th>
              <th data-i18n="inMoveCol"></th>
              <th data-i18n="outMoveCol"></th>
              <th data-i18n="lossCol"></th>
              <th data-i18n="saleCol"></th>
              <th data-i18n="currentStockCol"></th>
            </tr>
          </thead>
          <tbody id="group-movement-body">
            <tr>
              <td colspan="7" class="empty-message" id="movement-loading-message"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2 data-i18n="compositionPanelTitle"></h2>
      </div>

      <div class="composition-body" id="composition-body">
        <div class="empty-message" id="composition-loading-message"></div>
      </div>
    </div>
  </div>

  <div class="small-note" id="main-note"></div>
  <div class="debug-box" id="debug-box"></div>

  <div class="overlay" id="overlay" onclick="closeSidePanel()"></div>

  <aside class="side-panel" id="side-panel">
    <div class="side-header">
      <h2 data-i18n="sideTitle"></h2>
      <button class="close-btn" onclick="closeSidePanel()" data-i18n="closeButton"></button>
    </div>

    <div class="side-body" id="side-tree">
      <div class="empty-message"></div>
    </div>
  </aside>

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeText(value) {
      return String(value ?? "")
        .replace(/\u00A0/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .toLocaleLowerCase("ru-RU");
    }

    function displayText(value) {
      return String(value ?? "")
        .replace(/\u00A0/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normalizeRussianDisplayTerm(value) {
      return displayText(value)
        .replace(/свино\s+маток/gi, "Свиноматок")
        .replace(/\s+/g, " ")
        .trim();
    }

    function hasCyrillic(value) {
      return /[А-Яа-яЁё]/.test(String(value ?? ""));
    }

    function translateTerm(value) {
      const original = displayText(value);

      if (getLang() === "ru") {
        return normalizeRussianDisplayTerm(original);
      }

      if (!original) return "-";

      const normalized = normalizeText(original);

      if (KO_TERM_MAP.has(normalized)) {
        return KO_TERM_MAP.get(normalized);
      }

      let translated = normalized;

      const entries = Array.from(KO_TERM_MAP.entries())
        .sort((a, b) => b[0].length - a[0].length);

      entries.forEach(([ru, ko]) => {
        translated = translated.replaceAll(ru, ko);
      });

      translated = translated
        .replace(/№\s*/g, "")
        .replace(/n\s*(\d+)/gi, "$1")
        .replace(/ст\.?/g, "구사")
        .replace(/нов\.?/g, "신사")
        .replace(/осн\.?/g, "본동")
        .replace(/\b(\d+)\b/g, "$1")
        .replace(/[-_/]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      if (!hasCyrillic(translated)) {
        return translated || original;
      }

      for (const [key, ko] of entries) {
        if (normalized.includes(key)) {
          const numberMatch = original.match(/\d+/);
          return numberMatch ? `${ko} ${numberMatch[0]}` : ko;
        }
      }

      return original;
    }

    function num(value) {
      if (value === null || value === undefined) return 0;

      const cleaned = String(value)
        .replace(/\u00A0/g, "")
        .replace(/\s/g, "")
        .replace(/,/g, "")
        .replace(/[^0-9.-]/g, "");

      const n = Number(cleaned);
      return Number.isFinite(n) ? n : 0;
    }

      return "0";
    }

    function gvizResponseToRows(response) {
      if (!response) throw new Error(tr("responseEmpty"));

      if (response.status === "error") {
        const err = response.errors && response.errors.length ? response.errors[0] : null;
        const detail = err?.detailed_message || err?.message || err?.reason || tr("responseError");
        throw new Error(detail);
      }

      if (!response.table || !response.table.rows) {
        throw new Error(tr("tableEmpty"));
      }

      const colCount = response.table.cols ? response.table.cols.length : 0;

      return response.table.rows.map(row => {
        const result = [];

        for (let i = 0; i < colCount; i++) {
          const cell = row.c && row.c[i] ? row.c[i] : null;

          if (!cell) {
            result.push("");
            continue;
          }

          if (cell.v instanceof Date) {
            result.push(cell.v);
            continue;
          }

          if (cell.f !== null && cell.f !== undefined) {
            result.push(cell.f);
            continue;
          }

          if (cell.v !== null && cell.v !== undefined) {
            result.push(cell.v);
            continue;
          }

          result.push("");
        }

        return result;
      });
    }

    function loadGvizRows(gid) {
      return new Promise((resolve, reject) => {
        clearOldJsonpScripts();

        const callbackName = "handleSheetResponse_" + Date.now() + "_" + Math.floor(Math.random() * 100000);

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error(tr("timeout")));
        }, 15000);

        function cleanup() {
          clearTimeout(timeout);

          const oldScript = document.getElementById(callbackName);
          if (oldScript) oldScript.remove();

          try {
            delete window[callbackName];
          } catch (e) {
            window[callbackName] = undefined;
          }
        }

        window[callbackName] = function(response) {
          try {
            const rows = gvizResponseToRows(response);
            cleanup();
            resolve(rows);
          } catch (err) {
            cleanup();
            reject(err);
          }
        };

        const tqx = encodeURIComponent("out:json;responseHandler:" + callbackName);

        let url =
          "https://docs.google.com/spreadsheets/d/" +
          encodeURIComponent(SHEET_ID) +
          "/gviz/tq?tqx=" +
          tqx +
          "&headers=0&t=" +
          Date.now();

        if (gid) {
          url += "&gid=" + encodeURIComponent(gid);
        }

        const script = document.createElement("script");
        script.id = callbackName;
        script.dataset.gvizScript = "true";
        script.src = url;

        script.onerror = function() {
          cleanup();
          reject(new Error(tr("scriptLoadFail")));
        };

        document.body.appendChild(script);
      });
    }

    function parseDateFromValue(value) {
      if (value instanceof Date && !isNaN(value.getTime())) {
        return new Date(value.getFullYear(), value.getMonth(), value.getDate());
      }

      if (typeof value === "number") {
        if (value >= 30000 && value <= 60000) {
          const base = new Date(1899, 11, 30);
          const date = new Date(base.getTime() + value * 24 * 60 * 60 * 1000);

          if (!isNaN(date.getTime())) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
          }
        }

        return null;
      }

      const text = String(value ?? "").trim();
      if (!text) return null;

      let match = text.match(/Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)/);
      if (match) {
        const y = Number(match[1]);
        const m = Number(match[2]);
        const d = Number(match[3]);
        const date = new Date(y, m, d);
        if (!isNaN(date.getTime())) return date;
      }

      match = text.match(/(20\d{2})[-./년\s]+(\d{1,2})[-./월\s]+(\d{1,2})/);
      if (match) {
        const y = Number(match[1]);
        const m = Number(match[2]) - 1;
        const d = Number(match[3]);
        const date = new Date(y, m, d);
        if (!isNaN(date.getTime())) return date;
      }

      match = text.match(/(\d{1,2})[-./](\d{1,2})[-./](20\d{2})/);
      if (match) {
        const d = Number(match[1]);
        const m = Number(match[2]) - 1;
        const y = Number(match[3]);
        const date = new Date(y, m, d);
        if (!isNaN(date.getTime())) return date;
      }

      match = text.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
      if (match) {
        const now = new Date();
        const y = now.getFullYear();
        const m = Number(match[1]) - 1;
        const d = Number(match[2]);
        const date = new Date(y, m, d);
        if (!isNaN(date.getTime())) return date;
      }

      return null;
    }

    function detectDateFromRow(row) {
      if (!row) return null;

      for (const cell of row) {
        const date = parseDateFromValue(cell);
        if (date) return date;
      }

      return null;
    }

    function formatLogDate(date) {
      if (!date || isNaN(date.getTime())) return "-";

      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");

      return getLang() === "ru" ? `${d}.${m}.${y}` : `${y}.${m}.${d}`;
    }

    function sameDate(a, b) {
      if (!a || !b) return false;

      return (
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate()
      );
    }

    function dateKey(date) {
      if (!date) return "";

      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");

      return `${y}-${m}-${d}`;
    }

    function hasAnyNumericValue(row) {
      if (!row || row.length < 9) return false;

      return (
        num(row[COL_PREVIOUS]) !== 0 ||
        num(row[COL_IN]) !== 0 ||
        num(row[COL_OUT]) !== 0 ||
        num(row[COL_LOSS]) !== 0 ||
        num(row[COL_SALE]) !== 0 ||
        num(row[COL_CURRENT]) !== 0
      );
    }

    function isValidTotalRecord(record) {
      if (!record) return false;

      return (
        record.previous !== 0 ||
        record.incoming !== 0 ||
        record.outgoing !== 0 ||
        record.loss !== 0 ||
        record.sale !== 0 ||
        record.current !== 0
      );
    }

    function extractDatedTotalRows(lines, options = {}) {
      const includeInvalid = options.includeInvalid === true;
      const records = [];
      let currentDate = null;

      lines.forEach((row, index) => {
        if (!row) return;

        const foundDate = detectDateFromRow(row);
        if (foundDate) currentDate = foundDate;

        if (row.length < 9) return;

        const sec = displayText(row[COL_SECTION]);
        const sub = displayText(row[COL_SUB]);

        if (!isGrandTotalRow(sec, sub)) return;

        const record = {
          rowIndex: index + 1,
          date: currentDate ? new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()) : null,
          previous: num(row[COL_PREVIOUS]),
          incoming: num(row[COL_IN]),
          outgoing: num(row[COL_OUT]),
          loss: num(row[COL_LOSS]),
          sale: num(row[COL_SALE]),
          current: num(row[COL_CURRENT])
        };

        if (includeInvalid || isValidTotalRecord(record)) {
          records.push(record);
        }
      });

      return records;
    }

    function getValidDatedTotalRows(lines) {
      return extractDatedTotalRows(lines)
        .filter(item => item.date && isValidTotalRecord(item))
        .sort((a, b) => {
          const dateDiff = a.date - b.date;
          if (dateDiff !== 0) return dateDiff;
          return a.rowIndex - b.rowIndex;
        });
    }

    function getUniqueLatestValidTotalRowsByDate(lines) {
      const validRows = getValidDatedTotalRows(lines);
      const map = new Map();

      validRows.forEach(record => {
        const key = dateKey(record.date);
        const existing = map.get(key);

        if (!existing || record.rowIndex > existing.rowIndex) {
          map.set(key, record);
        }
      });

      return Array.from(map.values()).sort((a, b) => {
        const dateDiff = a.date - b.date;
        if (dateDiff !== 0) return dateDiff;
        return a.rowIndex - b.rowIndex;
      });
    }

    function getLatestTotalRecord(lines) {
      const validRecords = getUniqueLatestValidTotalRowsByDate(lines);

      if (validRecords.length > 0) {
        return validRecords[validRecords.length - 1];
      }

      const fallback = extractDatedTotalRows(lines)
        .filter(item => isValidTotalRecord(item))
        .sort((a, b) => a.rowIndex - b.rowIndex);

      return fallback.length > 0 ? fallback[fallback.length - 1] : null;
    }

    function findLatestValidLogDate(lines) {
      const latestTotal = getLatestTotalRecord(lines);
      return latestTotal && latestTotal.date ? latestTotal.date : null;
    }

    function getRowsForDate(lines, targetDate) {
      if (!targetDate) return [];

      const result = [];
      let currentDate = null;
      let insideTargetDate = false;

      lines.forEach(row => {
        if (!row) return;

        const foundDate = detectDateFromRow(row);

        if (foundDate) {
          currentDate = foundDate;
          insideTargetDate = sameDate(currentDate, targetDate);
        }

        if (insideTargetDate && hasAnyNumericValue(row)) {
          result.push(row);
        }
      });

      return result;
    }

    function getRowsForLatestValidLog(lines) {
      const latestDate = findLatestValidLogDate(lines);

      if (!latestDate) {
        return lines.filter(row => hasAnyNumericValue(row));
      }

      const result = getRowsForDate(lines, latestDate);

      return result.length > 0 ? result : lines.filter(row => hasAnyNumericValue(row));
    }

    function updateLatestLogDate(lines) {
      const el = document.getElementById("latest-log-date");
      const latestDate = findLatestValidLogDate(lines);
      const formatted = formatLogDate(latestDate);

      el.textContent = `${tr("journalDate")}: ${formatted}`;

      return { date: latestDate, text: formatted };
    }

    function classifyGroup(section, sub) {
      const sec = normalizeText(section);
      const subText = normalizeText(sub);

      for (const rule of GROUP_RULES) {
        if (rule.match(sec, subText)) return rule;
      }

      return null;
    }

    function makeEmptyGroup(rule) {
      return {
        key: rule.key,
        labelKey: rule.labelKey,
        order: rule.order,
        previous: 0,
        incoming: 0,
        outgoing: 0,
        loss: 0,
        sale: 0,
        current: 0,
        count: 0
      };
    }

    function buildDetailRows(lines) {
      const result = [];
      const seen = new Set();
      let currentSection = "";
      let insideTotalBlock = false;

      lines.forEach((row, index) => {
        if (!row || row.length < 9) return;

        const rawSection = displayText(row[COL_SECTION]);
        const rawSub = displayText(row[COL_SUB]);

        if (rawSection) {
          if (isTotalLabel(rawSection)) {
            insideTotalBlock = true;
            return;
          }

          currentSection = rawSection;
          insideTotalBlock = false;
        } else {
          if (insideTotalBlock) return;
        }

        if (!currentSection) return;
        if (!rawSub && !rawSection) return;
        if (isTotalRow(rawSection, rawSub)) return;
        if (!hasAnyNumericValue(row)) return;

        const previous = num(row[COL_PREVIOUS]);
        const incoming = num(row[COL_IN]);
        const outgoing = num(row[COL_OUT]);
        const loss = num(row[COL_LOSS]);
        const sale = num(row[COL_SALE]);
        const current = num(row[COL_CURRENT]);

        const filledSection = currentSection;

        const key = [
          normalizeText(filledSection),
          normalizeText(rawSub),
          previous,
          incoming,
          outgoing,
          loss,
          sale,
          current
        ].join("|");

        if (seen.has(key)) return;
        seen.add(key);

        result.push({
          rowIndex: index + 1,
          section: filledSection,
          sub: rawSub || "-",
          previous,
          incoming,
          outgoing,
          loss,
          sale,
          current
        });
      });

      return result;
    }

    function buildSowSummaryFromLines(lines) {
      const sowRule = GROUP_RULES.find(rule => rule.key === "sow");
      if (!sowRule) return null;

      let totalCandidate = null;
      const sum = makeEmptyGroup(sowRule);

      lines.forEach(row => {
        if (!row || row.length < 9) return;

        const sec = displayText(row[COL_SECTION]);
        const sub = displayText(row[COL_SUB]);

        if (!isSowRow(sec, sub)) return;
        if (isGrandTotalRow(sec, sub)) return;
        if (!hasAnyNumericValue(row)) return;

        const record = {
          key: "sow",
          labelKey: "groupSow",
          order: 5,
          previous: num(row[COL_PREVIOUS]),
          incoming: num(row[COL_IN]),
          outgoing: num(row[COL_OUT]),
          loss: num(row[COL_LOSS]),
          sale: num(row[COL_SALE]),
          current: num(row[COL_CURRENT]),
          count: 1
        };

        if (isTotalRow(sec, sub)) {
          totalCandidate = record;
          return;
        }

        sum.previous += record.previous;
        sum.incoming += record.incoming;
        sum.outgoing += record.outgoing;
        sum.loss += record.loss;
        sum.sale += record.sale;
        sum.current += record.current;
        sum.count += 1;
      });

      if (totalCandidate && totalCandidate.current > 0) return totalCandidate;
      if (sum.count > 0) return sum;

      return null;
    }

    function buildGroupSummary(detailRows, latestLogRows) {
      const groups = new Map();

      GROUP_RULES
        .sort((a, b) => a.order - b.order)
        .forEach(rule => {
          groups.set(rule.key, makeEmptyGroup(rule));
        });

      detailRows.forEach(item => {
        const rule = classifyGroup(item.section, item.sub);
        if (!rule) return;

        const group = groups.get(rule.key);
        if (!group) return;

        group.previous += item.previous;
        group.incoming += item.incoming;
        group.outgoing += item.outgoing;
        group.loss += item.loss;
        group.sale += item.sale;
        group.current += item.current;
        group.count += 1;
      });

      const sowSummary = buildSowSummaryFromLines(latestLogRows);

      if (sowSummary) {
        groups.set("sow", sowSummary);
      }

      return Array.from(groups.values())
        .filter(group => {
          return group.previous !== 0 || group.incoming !== 0 || group.outgoing !== 0 || group.loss !== 0 || group.sale !== 0 || group.current !== 0 || group.count > 0;
        })
        .sort((a, b) => a.order - b.order);
    }

    function findTotals(lines, latestLogRows) {
      let totalPigs = 0;
      let totalMoms = 0;
      let dayLoss = 0;
      let daySale = 0;
      let foundTotalRow = false;
      let foundMomRow = false;

      const latestTotal = getLatestTotalRecord(lines);

      if (latestTotal) {
        totalPigs = latestTotal.current;
        dayLoss = latestTotal.loss;
        daySale = latestTotal.sale;
        foundTotalRow = true;
      }

      const sowSummary = buildSowSummaryFromLines(latestLogRows);

      if (sowSummary && sowSummary.current > 0) {
        totalMoms = sowSummary.current;
        foundMomRow = true;
      }

      if (totalMoms <= 0) totalMoms = 375;

      return {
        totalPigs,
        totalMoms,
        dayLoss,
        daySale,
        foundTotalRow,
        foundMomRow
      };
    }

    function calcMonthCumulative(lines) {
      const datedTotalRows = getUniqueLatestValidTotalRowsByDate(lines);

      if (datedTotalRows.length === 0) {
        return {
          monthLoss: 0,
          monthSale: 0,
          note: tr("monthFallback"),
          rowsUsed: 0
        };
      }

      const latest = datedTotalRows[datedTotalRows.length - 1];
      const latestDate = latest.date;
      const y = latestDate.getFullYear();
      const m = latestDate.getMonth();

      const monthRows = datedTotalRows.filter(item => {
        return item.date.getFullYear() === y && item.date.getMonth() === m;
      });

      const monthLabel = getLang() === "ru"
        ? `${String(m + 1).padStart(2, "0")}.${y} ${tr("monthCumulative")} · ${monthRows.length} ${tr("dayRecords")}`
        : `${y}.${String(m + 1).padStart(2, "0")} ${tr("monthCumulative")} · ${monthRows.length}개 ${tr("dayRecords")}`;

      return {
        monthLoss: monthRows.reduce((sum, item) => sum + item.loss, 0),
        monthSale: monthRows.reduce((sum, item) => sum + item.sale, 0),
        note: monthLabel,
        rowsUsed: monthRows.length
      };
    }

    function calcMsyByDiaryAverage(lines, fallbackSowCount) {
      const totalRowsByDate = getUniqueLatestValidTotalRowsByDate(lines);

      let totalSale = 0;
      let totalSowSum = 0;
      let validDays = 0;

      totalRowsByDate.forEach(totalRecord => {
        const dayRows = getRowsForDate(lines, totalRecord.date);
        const sowSummary = buildSowSummaryFromLines(dayRows);

        let sowCount = 0;

        if (sowSummary && sowSummary.current > 0) {
          sowCount = sowSummary.current;
        } else if (fallbackSowCount && fallbackSowCount > 0) {
          sowCount = fallbackSowCount;
        }

        if (sowCount <= 0) return;

        totalSale += totalRecord.sale;
        totalSowSum += sowCount;
        validDays += 1;
      });

      const estimatedMSY = totalSowSum > 0
        ? (totalSale * 365) / totalSowSum
        : 0;

      return {
        estimatedMSY,
        totalSale,
        totalSowSum,
        validDays,
        avgSow: validDays > 0 ? totalSowSum / validDays : 0
      };
    }

    function getGroupByKey(groups, key) {
      return groups.find(group => group.key === key) || null;
    }

    function renderMovementTable(groups) {
      const body = document.getElementById("group-movement-body");

      if (!groups.length) {
        body.innerHTML = `
          <tr>
            <td colspan="7" class="empty-message">${escapeHtml(tr("noMovementData"))}</td>
          </tr>
        `;
        return;
      }

      body.innerHTML = groups.map(group => {
        const lossCell = group.loss > 0
          ? `<span class="pill red">${group.loss.toLocaleString()}</span>`
          : `0`;

        const saleCell = group.sale > 0
          ? `<span class="pill green">${group.sale.toLocaleString()}</span>`
          : `0`;

        return `
          <tr>
            <td class="row-name">${escapeHtml(tr(group.labelKey))}</td>
            <td>${group.previous.toLocaleString()}</td>
            <td class="${group.incoming > 0 ? "positive-text" : ""}">${formatSigned(group.incoming)}</td>
            <td class="${group.outgoing > 0 ? "negative-text" : ""}">${group.outgoing > 0 ? "-" + group.outgoing.toLocaleString() : "0"}</td>
            <td>${lossCell}</td>
            <td>${saleCell}</td>
            <td class="current-strong">${group.current.toLocaleString()}</td>
          </tr>
        `;
      }).join("");
    }

    function renderCompositionTable(groups) {
      const box = document.getElementById("composition-body");

      const valid = groups.filter(group => group.current > 0);
      const total = valid.reduce((sum, group) => sum + group.current, 0);

      if (!valid.length || total <= 0) {
        box.innerHTML = `<div class="empty-message">${escapeHtml(tr("noCompositionData"))}</div>`;
        return;
      }

      const rowsHtml = valid.map(group => {
        const pct = total > 0 ? (group.current / total) * 100 : 0;

        return `
          <tr>
            <td class="group-name">${escapeHtml(tr(group.labelKey))}</td>
            <td class="head-count">${formatHead(group.current)}</td>
            <td class="percent">${pct.toFixed(1)}%</td>
          </tr>
        `;
      }).join("");

      box.innerHTML = `
        <table class="composition-table">
          <thead>
            <tr>
              <th>${escapeHtml(tr("groupCol"))}</th>
              <th>${escapeHtml(tr("currentCol"))}</th>
              <th>${escapeHtml(tr("percentCol"))}</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>

        <div class="composition-summary">
          <span>${escapeHtml(tr("totalHeads"))}</span>
          <span>${formatHead(total)}</span>
        </div>
      `;
    }

    function renderSideTree(detailRows) {
      const sideTree = document.getElementById("side-tree");

      if (!detailRows.length) {
        sideTree.innerHTML = `<div class="empty-message">${escapeHtml(tr("noDetailData"))}</div>`;
        return;
      }

      const grouped = new Map();

      detailRows.forEach(item => {
        if (isTotalLabel(item.section)) return;

        if (!grouped.has(item.section)) grouped.set(item.section, []);
        grouped.get(item.section).push(item);
      });

      let html = "";

      Array.from(grouped.entries()).forEach(([section, items], index) => {
        const totalPrevious = items.reduce((sum, item) => sum + item.previous, 0);
        const totalIncoming = items.reduce((sum, item) => sum + item.incoming, 0);
        const totalOutgoing = items.reduce((sum, item) => sum + item.outgoing, 0);
        const totalLoss = items.reduce((sum, item) => sum + item.loss, 0);
        const totalSale = items.reduce((sum, item) => sum + item.sale, 0);
        const totalCurrent = items.reduce((sum, item) => sum + item.current, 0);
        const groupId = "tree-group-" + index;

        html += `
          <div class="tree-group ${index === 0 ? "open" : ""}" id="${groupId}">
            <div class="tree-title" onclick="toggleTreeGroup('${groupId}')">
              <span>${escapeHtml(translateTerm(section))}</span>
              <span>${formatHead(totalCurrent)} ▾</span>
            </div>

            <div class="tree-content">
              <div style="overflow-x:auto;">
                <table class="detail-table">
                  <thead>
                    <tr>
                      <th class="text-left">${escapeHtml(tr("groupCol"))}</th>
                      <th>${escapeHtml(tr("prevStockCol"))}</th>
                      <th>${escapeHtml(tr("inMoveCol"))}</th>
                      <th>${escapeHtml(tr("outMoveCol"))}</th>
                      <th>${escapeHtml(tr("lossCol"))}</th>
                      <th>${escapeHtml(tr("saleCol"))}</th>
                      <th>${escapeHtml(tr("currentStockCol"))}</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${items.map(item => `
                      <tr>
                        <td class="text-left">${escapeHtml(translateTerm(item.sub))}</td>
                        <td>${item.previous.toLocaleString()}</td>
                        <td class="${item.incoming > 0 ? "success-text" : ""}">${formatSigned(item.incoming)}</td>
                        <td class="${item.outgoing > 0 ? "danger-text" : ""}">${item.outgoing > 0 ? "-" + item.outgoing.toLocaleString() : "0"}</td>
                        <td class="danger-text">${item.loss.toLocaleString()}</td>
                        <td class="success-text">${item.sale.toLocaleString()}</td>
                        <td class="number-strong">${item.current.toLocaleString()}</td>
                      </tr>
                    `).join("")}
                    <tr>
                      <td class="text-left">${escapeHtml(tr("total"))}</td>
                      <td class="number-strong">${totalPrevious.toLocaleString()}</td>
                      <td class="number-strong">${formatSigned(totalIncoming)}</td>
                      <td class="number-strong">${totalOutgoing > 0 ? "-" + totalOutgoing.toLocaleString() : "0"}</td>
                      <td class="danger-text">${totalLoss.toLocaleString()}</td>
                      <td class="success-text">${totalSale.toLocaleString()}</td>
                      <td class="number-strong">${totalCurrent.toLocaleString()}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      });

      sideTree.innerHTML = html;
    }

    function renderDashboard(lines, gidUsed) {
      latestRows = lines;
      latestGidUsed = gidUsed;

      applyStaticTexts();

      const logDateInfo = updateLatestLogDate(lines);

      const latestLogRows = getRowsForLatestValidLog(lines);
      const detailRows = buildDetailRows(latestLogRows);
      latestDetailRows = detailRows;

      const groups = buildGroupSummary(detailRows, latestLogRows);
      const totals = findTotals(lines, latestLogRows);
      const month = calcMonthCumulative(lines);
      const msyStats = calcMsyByDiaryAverage(lines, totals.totalMoms);
      const fatteningGroup = getGroupByKey(groups, "fattening");

      const estimatedMSY = msyStats.estimatedMSY > 0
        ? msyStats.estimatedMSY.toFixed(2)
        : "0.00";

      document.getElementById("val-msy").textContent = estimatedMSY;
      document.getElementById("val-total").textContent = formatHead(totals.totalPigs);
      document.getElementById("val-moms").textContent = formatHead(totals.totalMoms);
      document.getElementById("val-fattening").textContent = formatHead(fatteningGroup ? fatteningGroup.current : 0);

      document.getElementById("val-month-sale").textContent = formatHead(month.monthSale);
      document.getElementById("val-day-sale").textContent = formatHead(totals.daySale);
      document.getElementById("val-month-loss").textContent = formatHead(month.monthLoss);
      document.getElementById("val-day-loss").textContent = formatHead(totals.dayLoss);

      document.getElementById("month-sale-note").textContent = month.note;
      document.getElementById("month-loss-note").textContent = month.note;

      renderMovementTable(groups);
      renderCompositionTable(groups);
      renderSideTree(detailRows);

      const gidText = gidUsed ? `gid=${gidUsed}` : tr("firstSheet");
      const logDateText = logDateInfo && logDateInfo.text !== "-"
        ? ` · ${tr("journalDate")} ${logDateInfo.text}`
        : "";

      setStatus(
        "success",
        `${tr("statusSuccess")} · ${tr("usedSheet")}: ${gidText}${logDateText}`,
        `${tr("lastUpdated")}: ${nowText()}`
      );

      const sideSectionCount = new Set(detailRows.map(row => row.section)).size;
      const validDatedTotalRows = getUniqueLatestValidTotalRowsByDate(lines);
      const allTotalRows = extractDatedTotalRows(lines, { includeInvalid: true });
      const ignoredBlankRows = Math.max(0, allTotalRows.length - extractDatedTotalRows(lines).length);
      const sowSummary = buildSowSummaryFromLines(latestLogRows);

      showDebug(`
        ${escapeHtml(tr("connectionSuccess"))}<br>
        ${escapeHtml(tr("usedSheet"))}: ${escapeHtml(gidText)}<br>
        ${escapeHtml(tr("latestLogDate"))}: ${escapeHtml(logDateInfo ? logDateInfo.text : "-")}<br>
        ${escapeHtml(tr("readRows"))}: ${formatRows(lines.length)}<br>
        ${escapeHtml(tr("validRows"))}: ${formatRows(latestLogRows.length)}<br>
        ${escapeHtml(tr("detailRows"))}: ${formatRows(detailRows.length)}<br>
        ${escapeHtml(tr("houseCount"))}: ${sideSectionCount.toLocaleString()}<br>
        ${escapeHtml(tr("groupCount"))}: ${groups.length.toLocaleString()}<br>
        ${escapeHtml(tr("datedTotalRows"))}: ${validDatedTotalRows.length.toLocaleString()}<br>
        ${escapeHtml(tr("ignoredBlankRows"))}: ${ignoredBlankRows.toLocaleString()}<br>
        ${escapeHtml(tr("monthRowsUsed"))}: ${month.rowsUsed.toLocaleString()}<br>
        ${escapeHtml(tr("msyRowsUsed"))}: ${msyStats.validDays.toLocaleString()}<br>
        ${escapeHtml(tr("msyTotalSale"))}: ${formatHead(msyStats.totalSale)}<br>
        ${escapeHtml(tr("msySowSum"))}: ${formatHead(msyStats.totalSowSum)}<br>
        ${escapeHtml(tr("msyAvgSow"))}: ${formatHead(msyStats.avgSow.toFixed(0))}<br>
        ${escapeHtml(tr("fatteningCombined"))}<br>
        ${escapeHtml(tr("sowAdded"))}: ${sowSummary ? tr("yes") : tr("no")}<br>
        ${escapeHtml(tr("totalExcluded"))}<br>
        ${escapeHtml(tr("totalRowFound"))}: ${totals.foundTotalRow ? tr("yes") : tr("no")}<br>
        ${escapeHtml(tr("sowRowFound"))}: ${totals.foundMomRow ? tr("yes") : tr("no")}
      `);

      return {
        groups,
        detailRows,
        totals,
        logDateInfo,
        month,
        msyStats
      };
    }

    async function loadPigsData() {
      setLoadingState(true);
      hideDebug();

      setStatus("", tr("statusLoading"), `${tr("lastUpdated")}: -`);
      document.getElementById("latest-log-date").textContent = `${tr("journalDate")}: -`;
      resetEmptyMessages();

      const errors = [];

      try {
        for (const gid of GID_CANDIDATES) {
          try {
            const rows = await loadGvizRows(gid);
            const result = renderDashboard(rows, gid);

            if (
              result.totals.foundTotalRow ||
              result.groups.length > 0 ||
              result.detailRows.length > 0
            ) {
              return;
            }

            errors.push(`${gid ? "gid=" + gid : tr("firstSheet")}: ${tr("linkedButNoData")}`);
          } catch (err) {
            errors.push(`${gid ? "gid=" + gid : tr("firstSheet")}: ${err.message}`);
          }
        }

        throw new Error(tr("errorNoValidData"));

      } catch (err) {
        console.error(err);

        setStatus("error", tr("statusError"), `${tr("lastUpdated")}: -`);
        document.getElementById("latest-log-date").textContent = `${tr("journalDate")}: -`;

        document.getElementById("group-movement-body").innerHTML = `
          <tr>
            <td colspan="7" class="empty-message" style="color:red; font-weight:800;">
              ${escapeHtml(tr("statusError"))}: ${escapeHtml(err.message)}
            </td>
          </tr>
        `;

        document.getElementById("composition-body").innerHTML = `
          <div class="empty-message" style="color:red; font-weight:800;">
            ${escapeHtml(tr("statusError"))}
          </div>
        `;

        document.getElementById("side-tree").innerHTML = `
          <div class="empty-message" style="color:red; font-weight:800;">
            ${escapeHtml(tr("errorLoadDetail"))}
          </div>
        `;

        showDebug(`
          ${escapeHtml(tr("checkItems"))}:<br>
          ${escapeHtml(tr("check1"))}<br>
          ${escapeHtml(tr("check2"))}<br>
          ${escapeHtml(tr("check3"))}<br>
          ${escapeHtml(tr("check4"))}<br><br>
          ${escapeHtml(tr("detailError"))}:<br>
          ${errors.map(escapeHtml).join("<br>")}
        `);

      } finally {
        setLoadingState(false);
      }
    }

    function initializeDashboard() {
      const savedLang = getLang();
      setLang(savedLang);
      applyStaticTexts();
      resetEmptyMessages();
      loadPigsData();
    }

    window.addEventListener("load", initializeDashboard);
  </script>
</body>
